<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SmartGym 360 — an intelligent gym built on converging technologies</title>
    <meta name="description" content="A complete system design converging IoT, edge computing, cloud, AI and a distributed ledger into one operating system for a fitness facility." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartGym 360" />
    <meta property="og:description" content="A gym that knows what is happening inside it. IoT, edge AI, cloud and ledger, converged into one operating system for a fitness facility." />
    <!-- /Smartgym360/ is substituted at build time. A relative path would not be
         rewritten and breaks once the site is served from /<repo-name>/.
         Note: some social crawlers require an absolute URL here — swap in the
         full origin once the deployment domain is known. -->
    <meta property="og:image" content="/Smartgym360/frames/poster.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The nav mark, as a favicon: a ring with the accent on its trailing
         half. Was still the pre-nocturnal palette (#171717 grey, #a16207 gold)
         long after the site turned violet and magenta — and being the browser
         tab, it was the one asset wrong on every page at once. Colours here
         are --c-fg-subtle and --c-accent from tokens.css; a data URI cannot
         read custom properties, so they are literals and must be updated by
         hand if the palette moves again. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%239086ab' stroke-width='4'/%3E%3Cpath d='M16 4a12 12 0 0 1 0 24' fill='none' stroke='%23ff2d6f' stroke-width='4'/%3E%3C/svg%3E" />

    <!-- No hero-frame preload here. index.html is shared by all five routes, so
         a static preload downloads ~47 KB on the four pages that never use it
         and the browser rightly warns about it. ScrollScrubber requests frame 0
         first with fetchpriority="high" instead — the same head start, only on
         the page that needs it. -->
    <script type="module" crossorigin src="/Smartgym360/assets/index-DqkWDKA7.js"></script>
    <link rel="stylesheet" crossorigin href="/Smartgym360/assets/index-CNL_xOrS.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:42rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1 style="letter-spacing:-0.03em">SmartGym 360</h1>
        <p>This site needs JavaScript for the scroll-driven hero. The full design —
           architecture, AI systems, data-protection posture and business case — is
           written up as Markdown in the <code>docs/</code> folder of the repository
           and reads perfectly well without it.</p>
      </div>
    </noscript>
  </body>
</html>
